services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Load Firebase vars from .env verbatim — avoids Compose corrupting JSON that contains `$`, etc.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
